<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TestersBench Demo Items</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
    nav a { margin-right: 1rem; }
    li { margin: 0.35rem 0; }
    button { margin-left: 0.5rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main">
      <a data-testid="nav-home" href="index.html">Home</a>
      <a data-testid="nav-form" href="form.html">Form</a>
      <a data-testid="nav-items" href="items.html">Items</a>
    </nav>
  </header>
  <main>
    <h1 data-testid="items-title">Items</h1>
    <p class="error" data-testid="items-error" hidden></p>
    <input data-testid="item-input" type="text" placeholder="New item" />
    <button data-testid="item-add" type="button">Add</button>
    <ul data-testid="item-list"></ul>
    <p data-testid="item-empty">No items yet</p>
  </main>
  <script>
    const input = document.querySelector('[data-testid="item-input"]');
    const addBtn = document.querySelector('[data-testid="item-add"]');
    const list = document.querySelector('[data-testid="item-list"]');
    const empty = document.querySelector('[data-testid="item-empty"]');
    const error = document.querySelector('[data-testid="items-error"]');

    function render(items) {
      list.innerHTML = '';
      empty.hidden = items.length > 0;
      items.forEach((item) => {
        const li = document.createElement('li');
        li.setAttribute('data-testid', 'item-row');
        li.innerHTML = `<span data-testid="item-text">${item.title}</span>
          <button data-testid="item-delete" data-id="${item.id}" type="button">Delete</button>`;
        list.appendChild(li);
      });
    }

    async function loadItems() {
      error.hidden = true;
      const response = await fetch('/api/items');
      const data = await response.json();
      if (!response.ok) {
        error.hidden = false;
        error.textContent = data.error || 'Failed to load items';
        render([]);
        return;
      }
      render(data.items || []);
    }

    addBtn.addEventListener('click', async () => {
      const title = input.value.trim();
      if (!title) return;
      const response = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      const data = await response.json();
      if (!response.ok) {
        error.hidden = false;
        error.textContent = data.error || 'Failed to add item';
        return;
      }
      input.value = '';
      render(data.items || []);
    });

    list.addEventListener('click', async (event) => {
      const target = event.target;
      if (target && target.matches('[data-testid="item-delete"]')) {
        const id = target.getAttribute('data-id');
        const response = await fetch(`/api/items/${id}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok) {
          error.hidden = false;
          error.textContent = data.error || 'Failed to delete item';
          return;
        }
        render(data.items || []);
      }
    });

    loadItems();
  </script>
</body>
</html>
