<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TestersBench Demo Login</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
    label { display: block; margin-top: 0.75rem; }
    input, button { margin-top: 0.25rem; padding: 0.45rem 0.65rem; }
    .error { color: #b00020; min-height: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1 data-testid="login-title">Sign in</h1>
    <p data-testid="login-hint">Use demo@example.com / demopass</p>
    <form id="login-form" novalidate>
      <label>Email
        <input data-testid="login-email" name="email" type="email" autocomplete="username" />
      </label>
      <label>Password
        <input data-testid="login-password" name="password" type="password" autocomplete="current-password" />
      </label>
      <p class="error" data-testid="login-error"></p>
      <button data-testid="login-submit" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const error = document.querySelector('[data-testid="login-error"]');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      const email = document.querySelector('[data-testid="login-email"]').value.trim();
      const password = document.querySelector('[data-testid="login-password"]').value;
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) {
        error.textContent = data.error || 'Login failed';
        return;
      }
      localStorage.setItem('tb_token', data.token);
      localStorage.setItem('tb_user', JSON.stringify(data.user));
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
