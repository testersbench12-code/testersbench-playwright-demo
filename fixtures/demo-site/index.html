<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TestersBench Demo Home</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
    nav a { margin-right: 1rem; }
    header { border-bottom: 1px solid #ddd; padding-bottom: 0.75rem; margin-bottom: 1rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <header>
    <strong data-testid="brand">TestersBench Demo</strong>
    <nav aria-label="Main">
      <a data-testid="nav-home" href="index.html">Home</a>
      <a data-testid="nav-form" href="form.html">Form</a>
      <a data-testid="nav-items" href="items.html">Items</a>
      <a data-testid="nav-error" href="missing.html">Broken link</a>
      <a data-testid="nav-login" href="login.html">Login</a>
    </nav>
    <span data-testid="auth-user" hidden></span>
  </header>
  <main>
    <h1 data-testid="home-title">Welcome</h1>
    <p data-testid="home-hero">Authenticated SaaS demo for smoke, forms, CRUD, responsive, and error flows.</p>
    <p data-testid="home-auth-state">Checking session…</p>
  </main>
  <script>
    async function hydrateAuth() {
      const state = document.querySelector('[data-testid="home-auth-state"]');
      const userEl = document.querySelector('[data-testid="auth-user"]');
      try {
        const response = await fetch('/api/me');
        const data = await response.json();
        if (response.ok && data.ok) {
          state.textContent = `Signed in as ${data.user.email}`;
          userEl.hidden = false;
          userEl.textContent = data.user.name;
          return;
        }
      } catch {}
      state.textContent = 'Signed out — open Login to create a session.';
    }
    hydrateAuth();
  </script>
</body>
</html>
